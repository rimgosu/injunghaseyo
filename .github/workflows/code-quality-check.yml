name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.10.0"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install

      - name: Check formatting
        run: yarn format --check

      - name: Run tests
        run: yarn test

      - name: Build check
        run: yarn build
