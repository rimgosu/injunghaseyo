name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.10.0"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install

      - name: Generate Prisma Client
        run: |
          cd packages/backend
          echo "DATABASE_URL=postgresql://test:test@localhost:5432/test" > ./envs/.dev.env
          yarn prisma generate
          yarn prisma migrate deploy

      - name: Check formatting
        run: yarn format --check

      - name: Run tests
        run: yarn test

      - name: Build check
        run: yarn build
